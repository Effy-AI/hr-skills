name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      # Frontmatter, naming, and self-containment. Catches the failure modes that
      # produce no error at runtime — a skill with unparseable frontmatter simply
      # never triggers.
      - name: Validate skill library
        run: python3 scripts/validate-skills.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The library is plugin-shaped, so Claude Code's own validator applies even
      # without a manifest. Informational until the repo converts to a plugin.
      - name: Plugin-shape check
        continue-on-error: true
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
